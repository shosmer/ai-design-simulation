[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "des-sim"
version = "0.1.0"
description = "Simulation of AI's impact on designers in tech — data ingestion layer"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "pyarrow>=14",
    "openpyxl>=3.1",
    "huggingface_hub>=0.20",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[project.scripts]
des-sim-ingest = "des_sim.cli:main"
des-sim-run = "des_sim.model.experiment:main"
des-sim-backcast = "des_sim.model.backcast:main"
des-sim-scenarios = "des_sim.model.scenarios:main"
des-sim-story = "des_sim.model.story:main"

[tool.hatch.build.targets.wheel]
packages = ["src/des_sim"]
